<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Reading & Task Assessment System</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            direction: ltr;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .selector-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 180px;
        }

        label {
            font-weight: bold;
            color: var(--primary-color);
        }

        select, input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        .class-section {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            page-break-after: always;
        }

        .class-title {
            color: var(--primary-color);
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 8px;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.4rem;
            text-align: right;
        }

        .report-header-title {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .task-badge {
            text-align: center;
            font-size: 0.95rem;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            direction: rtl;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 8px 4px;
            font-size: 0.9rem;
        }

        th {
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 700;
        }

        .score-input {
            width: 50px;
            text-align: center;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-weight: bold;
        }

        .score-high { color: #27ae60; font-weight: bold; }
        .score-medium { color: #e67e22; font-weight: bold; }
        .score-low { color: #e74c3c; font-weight: bold; }

        .status-box {
            text-align: center;
            padding: 30px;
            font-size: 1.1rem;
            color: #666;
            background: #fff;
            border-radius: 8px;
        }

        .btn-fetch {
            padding: 10px 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            height: fit-content;
            font-weight: bold;
        }
        .btn-fetch:hover { background: #219653; }

        .video-link {
            color: #2980b9;
            text-decoration: none;
            font-weight: bold;
        }
        .video-link:hover { text-decoration: underline; }

        @media print {
            .selector-card, .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .class-section { box-shadow: none; padding: 0; margin-bottom: 0; page-break-after: always; }
            table, th, td { border: 1px solid #000; }
            .score-input { border: none; background: transparent; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="reportTitleHeader" class="report-header-title">Reading Assessment Report</h1>
    <div id="taskSubHeader" class="task-badge">Current Story/Task: General Task</div>

    <div class="selector-card">
        <div class="form-group" style="flex: 2;">
            <label for="taskSelect">Story / Task Records:</label>
            <select id="taskSelect" onchange="switchTaskRecord(this.value)"></select>
        </div>

        <div class="form-group" style="flex: 2;">
            <label for="reportTitleInput">Story/Task Title (Edit):</label>
            <input type="text" id="reportTitleInput" placeholder="e.g. The Boy Who Cried Wolf" oninput="onManualTitleChange(this.value)">
        </div>

        <div class="form-group">
            <label for="stageSelect">Grade / Stage:</label>
            <select id="stageSelect" onchange="onStageChange()">
                <option value="">-- Select Grade --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="classSelect">Class / Section:</label>
            <select id="classSelect" onchange="renderFilteredData()" disabled>
                <option value="">-- Select Class --</option>
            </select>
        </div>

        <button id="fetchBtn" class="no-print btn-fetch" onclick="fetchDataFromGoogleSheets()">🔄 جلب الدرجات من الشيت</button>
        <button class="no-print" onclick="window.print()" style="padding: 10px 20px; background: var(--accent-color); color: white; border: none; border-radius: 6px; cursor: pointer; height: fit-content;">Print Report 🖨️</button>
    </div>

    <div id="dataContainer">
        <div class="status-box">Loading records...</div>
    </div>
</div>

    let tasksRecords = {};
    let currentTaskKey = "General Task";
    let currentRawData = [];
    let saveTimeout = null;

    function formatStoryTitle(title) {
        if (!title) return "General Task";
        let cleaned = decodeURIComponent(title).trim().replace(/[-_]/g, ' ');
        return cleaned.replace(/\s+/g, ' ');
    }

    function getNormalizedKey(title) {
        return formatStoryTitle(title).toLowerCase();
    }

    // تحويل البيانات الهيكلية للطلاب إلى مصفوفة مسطحة تناسب الجداول
    function transformNestedData(data) {
        const result = [];
        if (!data || typeof data !== 'object') return result;

        function traverse(obj, stageName = "", className = "") {
            for (const key in obj) {
                const value = obj[key];

                if (Array.isArray(value)) {
                    for (const student of value) {
                        result.push({
                            stage: stageName || "General",
                            className: className || key,
                            name: student.name || student["Student Name"] || "",
                            studentId: String(student.id || student.StudentId || student["Student ID"] || "").trim(),
                            scores: [0, 0, 0, 0, 0],
                            videoUrl: ""
                        });
                    }
                } else if (typeof value === 'object' && value !== null) {
                    if (!stageName) traverse(value, key, className);
                    else if (!className) traverse(value, stageName, key);
                    else traverse(value, stageName, className);
                }
            }
        }
        traverse(data);
        return result;
    }

    async function loadClassesData() {
        const urlParams = new URLSearchParams(window.location.search);
        const taskFromUrl = urlParams.get('task') || urlParams.get('story') || urlParams.get('title');
        if (taskFromUrl) currentTaskKey = formatStoryTitle(taskFromUrl);

        // الاعتماد على البيانات المدمجة في الكود مباشرة
        tasksRecords[currentTaskKey] = transformNestedData(baseStructureData);

        await fetchDataFromGoogleSheets();
        initSystem();
    }

    // جلب الدرجات وروابط الفيديوهات ديناميكياً من قوقل شيت
    async function fetchDataFromGoogleSheets() {
        const btn = document.getElementById('fetchBtn');
        if(btn) btn.innerText = "⏳ fetching grades...";
        
        try {
            const res = await fetch(APPS_SCRIPT_URL);
            const data = await res.json();
            if (!data.success || !Array.isArray(data.records)) return;

            const cloudMap = {};
            data.records.forEach((record) => {
                const formattedTitle = formatStoryTitle(record.story || "General Task");
                const normKey = getNormalizedKey(formattedTitle);
                const studentId = String(record.id || "").trim();
                const scoreVal = Number(record.score);

                if (!cloudMap[normKey]) {
                    cloudMap[normKey] = { originalTitle: formattedTitle, students: {} };
                }
                if (!cloudMap[normKey].students[studentId]) {
                    cloudMap[normKey].students[studentId] = { attempts: [], videoUrl: record.fileUrl || "" };
                }

                if (!isNaN(scoreVal) && scoreVal > 0) {
                    cloudMap[normKey].students[studentId].attempts.push({
                        score: scoreVal,
                        timestamp: new Date(record.timestamp).getTime() || 0
                    });
                }
                if (record.fileUrl) {
                    cloudMap[normKey].students[studentId].videoUrl = record.fileUrl;
                }
            });

            for (const normKey in cloudMap) {
                const storyData = cloudMap[normKey];
                let existingKey = Object.keys(tasksRecords).find(k => getNormalizedKey(k) === normKey);
                
                if (!existingKey) {
                    tasksRecords[storyData.originalTitle] = transformNestedData(baseStructureData);
                    existingKey = storyData.originalTitle;
                }

                const studentRecords = tasksRecords[existingKey];
                const cloudStudents = storyData.students;

                studentRecords.forEach(student => {
                    const sId = String(student.studentId).trim();
                    if (cloudStudents[sId]) {
                        const studentData = cloudStudents[sId];
                        if (studentData.videoUrl) student.videoUrl = studentData.videoUrl;

                        let attempts = studentData.attempts;
                        attempts.sort((a, b) => a.timestamp - b.timestamp);
                        let allScores = attempts.map(att => att.score);

                        if (allScores.length > 5) allScores = allScores.slice(allScores.length - 5);

                        let newScores = [0, 0, 0, 0, 0];
                        let startIndex = 5 - allScores.length;
                        for (let i = 0; i < allScores.length; i++) {
                            newScores[startIndex + i] = allScores[i];
                        }
                        student.scores = newScores;
                    }
                });
            }

            updateTaskDropdown();
            currentRawData = tasksRecords[currentTaskKey] || [];
            renderFilteredData();

        } catch (e) {
            console.error("Error fetching data from Sheet:", e);
        } finally {
            if(btn) btn.innerText = "🔄 جلب الدرجات من الشيت";
        }
    }

    function initSystem() {
        if (!tasksRecords[currentTaskKey]) {
            const found = Object.keys(tasksRecords).find(k => getNormalizedKey(k) === getNormalizedKey(currentTaskKey));
            if (found) currentTaskKey = found;
            else tasksRecords[currentTaskKey] = transformNestedData(baseStructureData);
        }
        updateTaskDropdown();
        loadCurrentTaskData(currentTaskKey);
    }

    function updateTaskDropdown() {
        const taskSelect = document.getElementById('taskSelect');
        taskSelect.innerHTML = '';
        const seenNormKeys = new Set();

        Object.keys(tasksRecords).forEach(taskName => {
            const norm = getNormalizedKey(taskName);
            if (!seenNormKeys.has(norm)) {
                seenNormKeys.add(norm);
                const opt = document.createElement('option');
                opt.value = taskName;
                opt.innerText = "📖 " + formatStoryTitle(taskName);
                if (norm === getNormalizedKey(currentTaskKey)) opt.selected = true;
                taskSelect.appendChild(opt);
            }
        });
    }

    function loadCurrentTaskData(taskName) {
        currentTaskKey = Object.keys(tasksRecords).find(k => getNormalizedKey(k) === getNormalizedKey(taskName)) || taskName;
        currentRawData = tasksRecords[currentTaskKey] || transformNestedData(baseStructureData);

        const formattedName = formatStoryTitle(currentTaskKey);
        document.title = `${formattedName} - Reading Report`;
        document.getElementById('reportTitleHeader').innerText = formattedName;
        document.getElementById('taskSubHeader').innerText = `Current Story / Task: ${formattedName}`;
        document.getElementById('reportTitleInput').value = formattedName;

        initStageDropdown();
        renderFilteredData();
    }

    function switchTaskRecord(newTaskName) { loadCurrentTaskData(newTaskName); }

    function onManualTitleChange(newTitle) {
        const formattedTitle = formatStoryTitle(newTitle.trim() || "Untitled Task");
        if (getNormalizedKey(formattedTitle) !== getNormalizedKey(currentTaskKey)) {
            tasksRecords[formattedTitle] = tasksRecords[currentTaskKey];
            delete tasksRecords[currentTaskKey];
            currentTaskKey = formattedTitle;
            updateTaskDropdown();
        }
    }

    function initStageDropdown() {
        const stageSelect = document.getElementById('stageSelect');
        const stages = [...new Set(currentRawData.map(item => String(item.stage || '')))].filter(Boolean);

        stageSelect.innerHTML = '<option value="">-- All Grades --</option>';
        stages.forEach(stage => {
            stageSelect.innerHTML += `<option value="${stage}">${stage}</option>`;
        });
        document.getElementById('classSelect').disabled = true;
    }

    function onStageChange() {
        const selectedStage = document.getElementById('stageSelect').value;
        const classSelect = document.getElementById('classSelect');
        classSelect.innerHTML = '<option value="">-- All Classes --</option>';

        if (selectedStage) {
            const filteredClasses = [...new Set(currentRawData
                .filter(item => String(item.stage) === selectedStage)
                .map(item => String(item.className || '')))].filter(Boolean);

            filteredClasses.forEach(c => {
                classSelect.innerHTML += `<option value="${c}">Class ${c}</option>`;
            });
            classSelect.disabled = false;
        } else {
            classSelect.disabled = true;
        }
        renderFilteredData();
    }

    function renderFilteredData() {
        const selectedStage = document.getElementById('stageSelect').value;
        const selectedClass = document.getElementById('classSelect').value;

        let filtered = currentRawData;
        if (selectedStage) filtered = filtered.filter(item => String(item.stage) === selectedStage);
        if (selectedClass) filtered = filtered.filter(item => String(item.className) === selectedClass);

        renderTables(filtered);
    }

    function getLatestFiveScores(scores) {
        if (!Array.isArray(scores)) return [0, 0, 0, 0, 0];
        let latest = [...scores];
        while (latest.length < 5) latest.unshift(0);
        return latest.slice(-5);
    }

    function updateScore(studentId, scoreIndex, newValue) {
        const student = currentRawData.find(s => String(s.studentId) === String(studentId));
        if (student) {
            const val = newValue === "" ? 0 : parseFloat(newValue);
            if (!student.scores) student.scores = [0, 0, 0, 0, 0];
            while (student.scores.length < 5) student.scores.push(0);

            if (scoreIndex !== null && scoreIndex !== undefined) {
                student.scores[scoreIndex] = isNaN(val) ? 0 : val;
            }

            const scores = getLatestFiveScores(student.scores);
            const progress = calculateProgress(scores);
            const progressCell = document.getElementById(`progress-${studentId}`);
            if (progressCell) {
                progressCell.innerText = progress !== null ? (progress > 0 ? `+${progress}%` : `${progress}%`) : "-";
                progressCell.className = getProgressClass(progress);
            }

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                sendGradeToAppsScript(studentId, student.scores[scoreIndex]);
            }, 800);
        }
    }

    async function sendGradeToAppsScript(studentId, scoreVal) {
        const student = currentRawData.find(s => String(s.studentId) === String(studentId));
        if (!student) return;

        const payload = {
            studentId: studentId,
            studentName: student.name,
            story: currentTaskKey,
            stage: student.stage,
            classRoom: student.className,
            score: scoreVal
        };

        try {
            await fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
        } catch (error) {
            console.error('Failed to save score:', error);
        }
    }

    function calculateProgress(scores) {
        const validScores = scores.map(s => Number(s)).filter(s => s > 0);
        if (validScores.length < 2) return null;
        const firstScore = validScores[0];
        const lastScore = validScores[validScores.length - 1];
        return (((lastScore - firstScore) / firstScore) * 100).toFixed(1);
    }

    function getProgressClass(progress) {
        if (progress === null) return 'score-medium';
        if (progress > 0) return 'score-high';
        if (progress == 0) return 'score-medium';
        return 'score-low';
    }

    function renderTables(data) {
        const container = document.getElementById('dataContainer');
        container.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = '<div class="status-box">No records found for this story.</div>';
            return;
        }

        const groupedByClass = data.reduce((acc, student) => {
            const key = `${student.stage} - Class ${student.className}`;
            if (!acc[key]) acc[key] = [];
            acc[key].push(student);
            return acc;
        }, {});

        const formattedTaskName = formatStoryTitle(currentTaskKey);

        for (const [classKey, students] of Object.entries(groupedByClass)) {
            let tableHTML = `
                <div class="class-section">
                    <h2 class="class-title">${classKey} - [ ${formattedTaskName} ]</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Student Name</th>
                                <th>Student ID</th>
                                <th>Score 1</th>
                                <th>Score 2</th>
                                <th>Score 3</th>
                                <th>Score 4</th>
                                <th>Score 5</th>
                                <th>Progress (%)</th>
                                <th>Recording Video</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            students.forEach((student, index) => {
                const scores = getLatestFiveScores(student.scores || []);
                const progress = calculateProgress(scores);
                const progressText = progress !== null ? (progress > 0 ? `+${progress}%` : `${progress}%`) : "-";
                const isTestUser = String(student.studentId) === "5555" || String(student.stage).includes("Test");

                const scoresCellsHTML = scores.map((score, idx) => `
                    <td>
                        <input type="number" min="0" max="100" class="score-input" 
                               value="${score > 0 ? score : ''}" 
                               oninput="updateScore('${student.studentId}', ${idx}, this.value)">
                    </td>
                `).join('');

                let videoCell = student.videoUrl ? 
                    `<a href="${student.videoUrl}" target="_blank" class="video-link">🎬 عرض التسجيل</a>` : 
                    `<span style="color: #999; font-size: 0.85rem;">No Recording</span>`;

                tableHTML += `
                    <tr style="${isTestUser ? 'background-color: #fef9c3;' : ''}">
                        <td>${index + 1}</td>
                        <td style="text-align: right; font-weight: 500;">${student.name}</td>
                        <td>${student.studentId}</td>
                        ${scoresCellsHTML}
                        <td id="progress-${student.studentId}" class="${getProgressClass(progress)}">${progressText}</td>
                        <td>${videoCell}</td>
                    </tr>
                `;
            });

            tableHTML += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML += tableHTML;
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        loadClassesData();
        
        setInterval(function() {
            fetchDataFromGoogleSheets();
        }, 20000);
    });
</script>
