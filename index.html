<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Reading & Task Assessment System</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            direction: ltr;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .selector-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 180px;
        }

        label {
            font-weight: bold;
            color: var(--primary-color);
        }

        select, input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
        }

        .class-section {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            page-break-after: always;
        }

        .class-title {
            color: var(--primary-color);
            border-bottom: 3px solid var(--accent-color);
            padding-bottom: 8px;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.4rem;
            text-align: right;
        }

        .report-header-title {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .task-badge {
            text-align: center;
            font-size: 0.95rem;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        /* اتجاه الجداول من اليمين إلى اليسار */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            direction: rtl;
        }

        th, td {
            border: 1px solid #e0e0e0;
            padding: 8px 4px;
            font-size: 0.9rem;
        }

        th {
            background-color: #f1f5f9;
            color: var(--primary-color);
            font-weight: 700;
        }

        .score-input {
            width: 50px;
            text-align: center;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-weight: bold;
        }

        .score-high { color: #27ae60; font-weight: bold; }
        .score-medium { color: #e67e22; font-weight: bold; }
        .score-low { color: #e74c3c; font-weight: bold; }

        .status-box {
            text-align: center;
            padding: 30px;
            font-size: 1.1rem;
            color: #666;
            background: #fff;
            border-radius: 8px;
        }

        @media print {
            .selector-card, .no-print { display: none !important; }
            body { background: white; padding: 0; }
            .class-section { box-shadow: none; padding: 0; margin-bottom: 0; page-break-after: always; }
            table, th, td { border: 1px solid #000; }
            .score-input {
                border: none;
                background: transparent;
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Dynamic Main Title & Subtitle -->
    <h1 id="reportTitleHeader" class="report-header-title">Reading Assessment Report</h1>
    <div id="taskSubHeader" class="task-badge">Current Story/Task: General Task</div>

    <!-- Controls Card -->
    <div class="selector-card">
        
        <div class="form-group" style="flex: 2;">
            <label for="taskSelect">Story / Task Records:</label>
            <select id="taskSelect" onchange="switchTaskRecord(this.value)">
                <!-- Dynamically populated -->
            </select>
        </div>

        <div class="form-group" style="flex: 2;">
            <label for="reportTitleInput">Story/Task Title (Edit):</label>
            <input type="text" id="reportTitleInput" placeholder="e.g. The Boy Who Cried Wolf" oninput="onManualTitleChange(this.value)">
        </div>

        <div class="form-group">
            <label for="stageSelect">Grade / Stage:</label>
            <select id="stageSelect" onchange="onStageChange()">
                <option value="">-- Select Grade --</option>
            </select>
        </div>

        <div class="form-group">
            <label for="classSelect">Class / Section:</label>
            <select id="classSelect" onchange="renderFilteredData()" disabled>
                <option value="">-- Select Class --</option>
            </select>
        </div>

        <button class="no-print" onclick="window.print()" style="padding: 10px 20px; background: var(--accent-color); color: white; border: none; border-radius: 6px; cursor: pointer; height: fit-content;">Print Report 🖨️</button>
    </div>

    <!-- Data Display Area -->
    <div id="dataContainer">
        <div class="status-box">Loading records...</div>
    </div>

</div>

        }
        return cleaned;

    function transformNestedData(data) {
        const result = [];
        for (const stage in data) {
            const classes = data[stage];
            for (const className in classes) {
                const students = classes[className];
                for (const student of students) {
                    result.push({
                        stage: stage,
                        className: className,
                        name: student.name || "",
                        nationalId: student.nationalId || student.id || "",
                        results: student.results ? [...student.results] : [0, 0, 0, 0, 0]
                    });
                }
            }
        }
        return result;
    }

        Object.keys(tasksRecords).forEach(taskName => {
            const opt = document.createElement('option');
            opt.value = taskName;
            opt.innerText = "📖 " + taskName;
            if (taskName === currentTaskKey) opt.selected = true;
            taskSelect.appendChild(opt);
        });
    }

    function loadCurrentTaskData(taskName) {
        currentTaskKey = taskName;
        currentRawData = tasksRecords[currentTaskKey];

        // Update headers, labels, and browser document title
        document.title = `${currentTaskKey} - Reading Report`;
        document.getElementById('reportTitleHeader').innerText = currentTaskKey;
        document.getElementById('taskSubHeader').innerText = `Current Story / Task: ${currentTaskKey}`;
        document.getElementById('reportTitleInput').value = currentTaskKey;

        initStageDropdown();
        renderFilteredData();
    }

    function switchTaskRecord(newTaskName) {
        loadCurrentTaskData(newTaskName);
    }

    function onManualTitleChange(newTitle) {
        const formattedTitle = newTitle.trim() || "Untitled Task";
        
        if (formattedTitle !== currentTaskKey) {
            tasksRecords[formattedTitle] = tasksRecords[currentTaskKey];
            delete tasksRecords[currentTaskKey];
            currentTaskKey = formattedTitle;
            
            document.title = `${currentTaskKey} - Reading Report`;
            document.getElementById('reportTitleHeader').innerText = currentTaskKey;
            document.getElementById('taskSubHeader').innerText = `Current Story / Task: ${currentTaskKey}`;
            updateTaskDropdown();
        }
    }

    function initStageDropdown() {
        const stageSelect = document.getElementById('stageSelect');
        const stages = [...new Set(currentRawData.map(item => item.stage))];

        stageSelect.innerHTML = '<option value="">-- All Grades --</option>';
        stages.forEach(stage => {
            const isTest = stage === "Test Grade";
            stageSelect.innerHTML += `<option value="${stage}">${isTest ? "🧪 " + stage : stage}</option>`;
        });

        document.getElementById('classSelect').disabled = true;
        document.getElementById('classSelect').innerHTML = '<option value="">-- All Classes --</option>';
    }

    function onStageChange() {
        const selectedStage = document.getElementById('stageSelect').value;
        const classSelect = document.getElementById('classSelect');

        classSelect.innerHTML = '<option value="">-- All Classes --</option>';

        if (selectedStage) {
            const filteredClasses = [...new Set(currentRawData.filter(item => item.stage === selectedStage).map(item => item.className))];
            filteredClasses.forEach(c => {
                const isTest = c === "Test Class";
                classSelect.innerHTML += `<option value="${c}">${isTest ? "🧪 " + c : "Class " + c}</option>`;
            });
            classSelect.disabled = false;
        } else {
            classSelect.disabled = true;
        }

        renderFilteredData();
    }

    function renderFilteredData() {
        const selectedStage = document.getElementById('stageSelect').value;
        const selectedClass = document.getElementById('classSelect').value;

        let filtered = currentRawData;

        if (selectedStage) {
            filtered = filtered.filter(item => item.stage === selectedStage);
        }
        if (selectedClass) {
            filtered = filtered.filter(item => item.className === selectedClass);
        }

        renderTables(filtered);
    }

    function getLatestFiveScores(scores) {
        if (!Array.isArray(scores)) return [0, 0, 0, 0, 0];
        let latest = [...scores];
        if (latest.length > 5) latest = latest.slice(-5);
        while (latest.length < 5) latest.push(0);
        return latest;
    }

    function updateScore(studentId, scoreIndex, newValue) {
        const student = currentRawData.find(s => s.nationalId === studentId);
        if (student) {
            const val = parseFloat(newValue) || 0;
            while (student.results.length < 5) student.results.push(0);
            student.results[scoreIndex] = val;

            const scores = getLatestFiveScores(student.results);
            const progress = calculateProgress(scores);
            const progressCell = document.getElementById(`progress-${studentId}`);
            if (progressCell) {
                progressCell.innerText = progress > 0 ? `+${progress}%` : `${progress}%`;
                progressCell.className = getProgressClass(progress);
            }
        }
    }

    function calculateProgress(scores) {
        const validScores = scores.map(s => Number(s)).filter(s => s > 0);
        if (validScores.length < 2) return 0;

        const firstScore = validScores[0];
        const lastScore = validScores[validScores.length - 1];
        
        return (((lastScore - firstScore) / firstScore) * 100).toFixed(1);
    }

    function getProgressClass(progress) {
        if (progress > 0) return 'score-high';
        if (progress == 0) return 'score-medium';
        return 'score-low';
    }

    function renderTables(data) {
        const container = document.getElementById('dataContainer');
        container.innerHTML = '';

        if (data.length === 0) {
            container.innerHTML = '<div class="status-box">No records found for this story.</div>';
            return;
        }

        const groupedByClass = data.reduce((acc, student) => {
            const key = `${student.stage} - Class ${student.className}`;
            if (!acc[key]) acc[key] = [];
            acc[key].push(student);
            return acc;
        }, {});

        for (const [classKey, students] of Object.entries(groupedByClass)) {
            let tableHTML = `
                <div class="class-section">
                    <h2 class="class-title">${classKey} - [ ${currentTaskKey} ]</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Student Name</th>
                                <th>National ID</th>
                                <th>Score 1</th>
                                <th>Score 2</th>
                                <th>Score 3</th>
                                <th>Score 4</th>
                                <th>Score 5</th>
                                <th>Progress (%)</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            students.forEach((student, index) => {
                const scores = getLatestFiveScores(student.results || []);
                const progress = calculateProgress(scores);
                const progressText = progress > 0 ? `+${progress}%` : `${progress}%`;
                const isTestUser = student.nationalId === "9999";

                tableHTML += `
                    <tr style="${isTestUser ? 'background-color: #fef9c3;' : ''}">
                        <td>${index + 1}</td>
                        <td style="text-align: right; font-weight: 500;">${student.name}</td>
                        <td>${student.nationalId}</td>
                        ${scores.map((score, idx) => `
                            <td>
                                <input type="number" min="0" max="100" class="score-input" 
                                       value="${score || ''}" 
                                       oninput="updateScore('${student.nationalId}',${idx}, this.value)">
                            </td>
                        `).join('')}
                        <td id="progress-${student.nationalId}" class="${getProgressClass(progress)}">${progressText}</td>
                    </tr>
                `;
            });

            tableHTML += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML += tableHTML;
        }
    }

    document.addEventListener('DOMContentLoaded', initSystem);
</script>
</body>
</html>
