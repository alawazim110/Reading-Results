name: Update Student Scores

on:
  repository_dispatch:
    types: [student_score, update-scores, student-scores-updated]
  workflow_dispatch:

jobs:
  update-score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Student Score in students.json
        id: process-scores
        run: |
          echo "::group::Updating Student Scores"
          
          STUDENT_NAME='${{ github.event.client_payload.student_name }}'
          NATIONAL_ID='${{ github.event.client_payload.national_id }}'
          SCORE='${{ github.event.client_payload.score }}'

          if [ -n "$NATIONAL_ID" ] && [ -n "$SCORE" ]; then
            jq --arg id "$NATIONAL_ID" --arg name "$STUDENT_NAME" --arg score "$SCORE" \
               'map(if .national_id == $id then .score = $score | .student_name = $name else . end) | if any(.[]; .national_id == $id) then . else . + [{"national_id": $id, "student_name": $name, "score": $score}] end' \
               students.json > tmp.json && mv tmp.json students.json
            
            echo "scores_updated=true" >> $GITHUB_OUTPUT
            echo "Status: Score updated successfully for ID: $NATIONAL_ID"
          else
            echo "::warning::No payload received (Manual test run)."
            echo "scores_updated=false" >> $GITHUB_OUTPUT
          fi
          
          echo "::endgroup::"

      - name: Commit and Push Updates
        if: success() && steps.process-scores.outputs.scores_updated == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          git add students.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update student score [skip ci]"
            git push
          fi
