name: Update Student Scores

on:
  # Allows external API/webhooks to trigger this workflow
  repository_dispatch:
    types: [update-scores, student-scores-updated]
  
  # Allows manual triggering from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      scores_payload:
        description: 'Optional JSON string or payload identifier for score updates'
        required: false
        default: '{}'

jobs:
  update-scores:
    name: Process and Update Scores
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Optional: Caches dependencies if standard requirements file exists

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate Event Payload
        id: validate-payload
        run: |
          echo "::group::Validating Event Payload"
          
          # Extract payload based on trigger event
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            PAYLOAD='${{ toJson(github.event.client_payload) }}'
          else
            PAYLOAD='${{ github.event.inputs.scores_payload }}'
          fi

          # Basic JSON validation check
          if ! echo "$PAYLOAD" | jq . >/dev/null 2>&1; then
            echo "::error::Invalid JSON payload provided."
            exit 1
          fi

          echo "Payload validated successfully."
          echo "::endgroup::"

      - name: Execute Score Update Script
        id: process-scores
        run: |
          echo "::group::Updating Student Scores"
          
          # Pass the event context to your update script
          if python scripts/update_scores.py \
              --event-name "${{ github.event_name }}" \
              --payload '${{ toJson(github.event.client_payload) }}'; then
            echo "scores_updated=true" >> $GITHUB_OUTPUT
            echo "Status: Scores processed successfully."
          else
            echo "::error::Score update script encountered an unhandled exception or exit code."
            echo "scores_updated=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "::endgroup::"

      - name: Commit Updated Scores
        if: success() && steps.process-scores.outputs.scores_updated == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Stage changes to student data files (adjust path as needed)
          git add data/scores/
          
          if git diff --staged --quiet; then
            echo "No changes in student scores to commit."
          else
            git commit -m "chore(scores): update student scores [skip ci]"
            git push
          fi

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### 📊 Student Scores Update Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Status:** ${{ job.status == 'success' && '✅ Succeeded' || '❌ Failed' }}"
          
          if [ "${{ job.status }}" != "success" ]; then
            echo "⚠️ *Please review the job logs for detailed error trace information.*" >> $GITHUB_STEP_SUMMARY
          fi
