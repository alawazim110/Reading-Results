name: Update Student Scores

on:
  repository_dispatch:
    types: [student_score, update-scores, student-scores-updated]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Student Score in students.json
        env:
          STUDENT_NAME: ${{ github.event.client_payload.student_name }}
          NATIONAL_ID: ${{ github.event.client_payload.national_id }}
          SCORE: ${{ github.event.client_payload.score }}
        run: |
          node -e '
            const fs = require("fs");
            const filePath = "students.json";
            
            if (!fs.existsSync(filePath)) {
              console.error("students.json not found!");
              process.exit(1);
            }
            
            let data = JSON.parse(fs.readFileSync(filePath, "utf8"));
            const targetId = String(process.env.NATIONAL_ID).trim();
            const newScore = Number(process.env.SCORE) || 0;

            function updateStudentResults(obj) {
              if (Array.isArray(obj)) {
                obj.forEach(student => {
                  if (student && typeof student === "object") {
                    const sId = String(
                      student.id || 
                      student.nationalId || 
                      student["National ID"] || 
                      student["معرف الطالب"] || ""
                    ).trim();

                    if (sId === targetId) {
                      const key = student.hasOwnProperty("score") ? "score" : "results";

                      if (!Array.isArray(student[key])) {
                        student[key] = [0, 0, 0, 0, 0];
                      }

                      // الجزء الذي تم إعادته: استبدال أول صفر موجود في القائمة بدلاً من push للنهاية
                      const zeroIndex = student[key].indexOf(0);

                      if (zeroIndex !== -1) {
                        student[key][zeroIndex] = newScore;
                      } else {
                        student[key].shift();
                        student[key].push(newScore);
                      }
                    }
                  }
                });
              } else if (typeof obj === "object" && obj !== null) {
                Object.keys(obj).forEach(key => updateStudentResults(obj[key]));
              }
            }

            updateStudentResults(data);
            fs.writeFileSync(filePath, JSON.stringify(data, null, 2));
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add students.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update score for student ID: ${{ github.event.client_payload.national_id }}" && git push)
