name: Update students JSON

on:
  repository_dispatch:
    types: [student_score]

jobs:
  update-students:
    runs-on: ubuntu-latest
    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. تحديث ملف students.json (الكود المعدل مع علامات التنصيص المزدوجة)
      - name: Update students.json
        env:
          STUDENT_NAME: ${{ github.event.client_payload.student_name }}
          NATIONAL_ID: ${{ github.event.client_payload.national_id }}
          SCORE: ${{ github.event.client_payload.score }}
        run: |
          node -e '
            const fs = require("fs");
            const filePath = "students.json";

            let data = [];
            if (fs.existsSync(filePath)) {
              try {
                data = JSON.parse(fs.readFileSync(filePath, "utf8"));
              } catch (e) {
                data = [];
              }
            }

            data.push({
              student: process.env.STUDENT_NAME || "",
              national_id: process.env.NATIONAL_ID || "",
              score: Number(process.env.SCORE) || 0,
              date: new Date().toISOString()
            });

            fs.writeFileSync(filePath, JSON.stringify(data, null, 2));
          '

      # 4. حفظ وتمرير التغييرات للمستودع
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add students.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update student score" && git push)
