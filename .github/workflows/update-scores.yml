name: Update Student Scores

on:
  repository_dispatch:
    types: [student_score, update-scores, student-scores-updated]
  workflow_dispatch:

jobs:
  update-score:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Student Score in students.json
        id: process-scores
        run: |
          node -e '
            const fs = require("fs");
            const filePath = "data.json";
            
            let data = [];
            if (fs.existsSync(filePath)) {
              try {
                data = JSON.parse(fs.readFileSync(filePath, "utf8"));
              } catch (e) {
                data = [];
              }
            }
            
            data.push({
              student: process.env.STUDENT_NAME,
              national_id: process.env.NATIONAL_ID,
              score: Number(process.env.SCORE),
              date: new Date().toISOString()
            });
            
            fs.writeFileSync(filePath, JSON.stringify(data, null, 2));
          '
